services:
    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_DB: cupid
            POSTGRES_USER: cupid
            POSTGRES_PASSWORD: cupid
        ports:
            - "5432:5432"
        networks:
            - cupid-network

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        networks:
            - cupid-network

    cupid-app:
        image: cupidtravel:latest
        container_name: cupid-app
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8085:8080" # Lokal makinenizin 8085 portunu konteynerin 8080 portuna yönlendiriyoruz
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cupid
            SPRING_DATASOURCE_USERNAME: cupid
            SPRING_DATASOURCE_PASSWORD: cupid
            SPRING_REDIS_HOST: redis
            SPRING_REDIS_PORT: 6379
        depends_on:
            - postgres
            - redis
        networks:
            - cupid-network

networks:
    cupid-network:
        driver: bridge