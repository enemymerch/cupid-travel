spring:
    web:
        locale: en
    application:
        name: cupid-travel
    datasource:
        driver-class-name: org.postgresql.Driver
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cupid}
        username: ${SPRING_DATASOURCE_USERNAME:cupid}
        password: ${SPRING_DATASOURCE_PASSWORD:cupid}
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: none
            dialect: org.hibernate.dialect.PostgreSQLDialect
    liquibase:
        change-log: classpath:/db/changelog/db.changelog-master.yaml
        enabled: true
    cache:
        type: redis
    data:
        redis:
            host: ${SPRING_REDIS_HOST:127.0.0.1}
            port: ${SPRING_REDIS_PORT:6379}
